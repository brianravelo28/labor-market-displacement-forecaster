services:
  - type: web
    name: labor-market-displacement-forecaster
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.app:server --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 4 --timeout 120
    envVars:
      - key: DASH_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"
